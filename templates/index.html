<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Regression Model Prediction</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1 class="text-center mt-5">Regression Model Prediction</h1>
        <form action="/predict" method="POST" class="mt-4">
            <div class="form-group">
                <label for="income">Average Area Income:</label>
                <input type="number" step="any" class="form-control" id="income" name="income" required>
            </div>
            <div class="form-group">
                <label for="house_age">Average Area House Age:</label>
                <input type="number" step="any" class="form-control" id="house_age" name="house_age" required>
            </div>
            <div class="form-group">
                <label for="rooms">Average Area Number of Rooms:</label>
                <input type="number" step="any" class="form-control" id="rooms" name="rooms" required>
            </div>
            <div class="form-group">
                <label for="bedrooms">Average Area Number of Bedrooms:</label>
                <input type="number" step="any" class="form-control" id="bedrooms" name="bedrooms" required>
            </div>
            <div class="form-group">
                <label for="population">Area Population:</label>
                <input type="number" step="any" class="form-control" id="population" name="population" required>
            </div>
            <div class="form-group">
                <label for="model">Select Model:</label>
                <select class="form-control" id="model" name="model_name">
                    {% for model_name in models %}
                        <option value="{{ model_name }}">{{ model_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Predict</button>
        </form>
        <div class="text-center mt-4">
            <a href="/results" class="btn btn-secondary">View Model Evaluation Results</a>
        </div>
        <div><a href="/comparison">View Model Comparison</a></div>
    </div>
    <div><a href="/history">Prediction History</a></div>
</body>
</html>
